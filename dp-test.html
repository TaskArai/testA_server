<!DOCTYPE html>
<html lang="ja">
<head>
  <script>
(function () {
    "use strict";

    // Cookieの設定
    const COOKIE_NAME = "ga_linker_backup";
    const COOKIE_MAX_AGE = 120; // 保存期間：120秒

    // URLから_glパラメーターを取得
    const params = new URLSearchParams(window.location.search);
    const gl = params.get("_gl");

    if (gl) {
        // 独自Cookieとして保存
        document.cookie =
            COOKIE_NAME + "=" + encodeURIComponent(gl) +
            "; path=/" +
            "; max-age=" + COOKIE_MAX_AGE +
            "; SameSite=Lax" +
            "; Secure";

        console.log("[GA Linker] _glをCookieに保存しました");
    } else {
        console.log("[GA Linker] URLに_glがありません");
    }
})();
</script>
  <title>test LP</title>
  <meta charset="UTF-8">
</head>
